<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>半導體晶片製作｜英文文法測驗</title>
<style>
:root{--bg:#0b1d31;--panel:#112d4b;--cyan:#55d8ff;--line:#1884b8;--white:#f6f9ff;--ink:#10253b}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--white);font-family:Arial,"Microsoft JhengHei",sans-serif}
main{max-width:1100px;margin:auto;padding:24px 18px 50px}h1{color:var(--cyan);font-size:clamp(24px,4vw,36px);margin:0 0 8px}.sub{color:#c8d9eb;margin-bottom:20px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:22px;margin:18px 0}
input,button,select{font:inherit;border-radius:10px;padding:12px;border:1px solid #8aa6c4}input{max-width:100%;width:100%}label{display:block;margin:10px 0 6px}
button{cursor:pointer;font-weight:700;background:var(--cyan);color:#08233b;border:0}button:disabled{opacity:.45;cursor:not-allowed}.secondary{background:#eaf3ff;color:#123}.steps{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px}.step{border:1px solid var(--line);border-radius:13px;padding:12px;text-align:center;background:#0c223b}.step strong{display:block;color:var(--cyan);margin-bottom:5px}.step small{color:#e0eafa}.cards{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px;margin-top:12px}.stage{background:transparent;color:var(--white);border:1px solid transparent;border-radius:12px;padding:14px;text-align:center;min-height:100px}.stage .num{font-size:24px;font-weight:bold;color:#087db3}.image-stage{padding:10px;display:flex;flex-direction:column;justify-content:center;gap:7px;background:transparent;color:var(--white);box-shadow:none}.image-stage img{width:100%;height:112px;object-fit:contain;border-radius:0;background:transparent;padding:0}.image-stage b{font-size:15px}.hidden{display:none!important}.topline{display:flex;justify-content:flex-start;gap:12px;align-items:center;color:#d9eaff}.progress-wrap{margin:12px 0 18px}.progress-meta{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;color:#d9eaff;font-size:14px;margin-bottom:8px}.progress-track{width:100%;height:10px;background:#071729;border:1px solid #28618a;border-radius:999px;overflow:hidden}.progress-fill{height:100%;width:0;background:linear-gradient(90deg,#25b7ed,#73e4ff);border-radius:999px;transition:width .2s ease}.qtitle{font-size:clamp(20px,3vw,28px);line-height:1.45;margin:12px 0}.zh{font-size:18px;color:#d4e6fa;margin:6px 0 20px}.opts{display:grid;gap:9px}.opt{width:100%;text-align:left;background:#f7faff;color:#17314c;border:2px solid transparent}.opt.selected{border-color:#37b9f0;background:#d8f3ff}.opt.correct{border-color:#24a46a}.opt.wrong{border-color:#dc5757}.feedback{min-height:25px;color:#bce9ff;margin-top:12px}.scramble-answer{display:flex;flex-wrap:wrap;gap:8px;min-height:48px;padding:10px;margin:10px 0 14px;border:1px dashed #7aa8c9;border-radius:10px;background:#0a223b}.word-chip{background:#eaf3ff;color:#17314c;border:2px solid #c6d6e6;padding:10px 14px;border-radius:10px}.word-chip:disabled{opacity:.4}.scramble-tools{margin-top:10px}.actions{display:flex;justify-content:flex-end;gap:12px;margin-top:18px}.actions button{min-width:110px}.tag{color:var(--cyan);font-weight:bold}.notice{color:#cbdced;font-size:14px}.result h2{color:var(--cyan)}.result-item{background:#f4f8ff;color:#17314c;border-radius:12px;padding:14px;margin:12px 0}.result-item h3{margin:0 0 8px}.good{color:#087c50}.bad{color:#b52d2d}.report-focus{margin:18px 0;padding:12px 18px;border:1px solid #8aa6c4;border-radius:10px}.report-focus h2{margin-top:0}.table-wrap{overflow-x:auto}.report-table{width:100%;border-collapse:collapse;background:white;color:#13283c;font-size:12px}.report-table th,.report-table td{border:1px solid #9aa9b7;padding:7px;vertical-align:top;text-align:left}.report-table th{background:#e8eef4}.report-table tr.row-good>td{background:#dff5e8;color:#17314c}.report-table tr.row-bad>td{background:#fde2e2;color:#17314c}.report-table tr.row-good>td.result-good{background:#dff5e8;color:#087c50;font-weight:bold;text-align:center}.report-table tr.row-bad>td.result-bad{background:#fde2e2;color:#b52d2d;font-weight:bold;text-align:center}.zhprint{font-size:11px;color:#43566a;margin-top:4px}
.stage-transition{min-height:330px;text-align:center;display:flex;flex-direction:column;align-items:center;justify-content:center;background:radial-gradient(circle at top,#1c5277 0,#112d4b 55%,#0b1d31 100%);border:2px solid var(--cyan);box-shadow:0 0 28px #26bde855}.stage-transition .transition-kicker{color:#9deaff;letter-spacing:2px;font-weight:bold}.stage-transition h2{font-size:clamp(26px,4vw,38px);color:var(--cyan);margin:12px 0}.stage-transition p{color:#e0efff;font-size:18px}.stage-transition img{width:min(340px,75%);height:160px;object-fit:contain;background:transparent;border-radius:0;padding:0;margin:12px}.stage-transition button{margin-top:10px;min-width:180px}.report-question{border:1px solid #aab7c4;border-radius:7px;padding:9px;margin:8px 0;color:#13283c;background:#fff}.report-question h3{font-size:13px;margin:0 0 6px;color:#13283c}.report-question p{margin:4px 0;font-size:11px;line-height:1.4}.report-question .label{font-weight:bold}.report-question .result-good{color:#087c50;font-weight:bold}.report-question .result-bad{color:#b52d2d;font-weight:bold}
@media(max-width:700px){main{padding:14px 10px 30px}.panel{padding:15px}.steps,.cards{grid-template-columns:repeat(2,minmax(0,1fr))}.step:last-child,.stage:last-child{grid-column:span 2}.topline{align-items:flex-start;flex-direction:column}}
@media print{@page{size:A4 portrait;margin:10mm}body{background:white;color:#111;font-size:9pt}main{max-width:none;padding:0}.no-print,#startPanel,#quizPanel,#homePanel{display:none!important}#resultPanel{display:block!important;border:0;background:white;color:#111;padding:0}.result h2{color:#111;font-size:15pt}.printhead{display:block!important}.report-focus{border:0;padding:0;margin:8px 0}.report-table{font-size:7pt;table-layout:fixed}.report-table th,.report-table td{padding:4px;overflow-wrap:anywhere}.report-table tr.row-good>td{background:#dff5e8!important;-webkit-print-color-adjust:exact;print-color-adjust:exact}.report-table tr.row-bad>td{background:#fde2e2!important;-webkit-print-color-adjust:exact;print-color-adjust:exact}.report-table tr.row-good>td.result-good{background:#dff5e8!important;color:#087c50!important;font-weight:bold;text-align:center;-webkit-print-color-adjust:exact;print-color-adjust:exact}.report-table tr.row-bad>td.result-bad{background:#fde2e2!important;color:#b52d2d!important;font-weight:bold;text-align:center;-webkit-print-color-adjust:exact;print-color-adjust:exact}.report-table th:nth-child(1){width:4%}.report-table th:nth-child(2){width:10%}.report-table th:nth-child(3){width:25%}.report-table th:nth-child(4){width:14%}.report-table th:nth-child(5){width:14%}.report-table th:nth-child(6){width:8%}.report-table th:nth-child(7){width:25%}.report-table tr{break-inside:avoid}.report-question{border:1px solid #aab7c4;border-radius:5px;padding:7px;margin:6px 0;break-inside:avoid;color:#111;background:#fff}.report-question h3{font-size:9pt;margin:0 0 4px}.report-question p{margin:3px 0;font-size:8pt;line-height:1.3}.report-question .label{font-weight:bold}.report-question .result-good{color:#087c50;font-weight:bold}.report-question .result-bad{color:#b52d2d;font-weight:bold}.good{color:#087c50}.bad{color:#b52d2d}}
.printhead{display:none}
</style></head>

const questions=[
{stage:0,type:"選擇題 Multiple Choice",q:"Thin film deposition ___ materials onto specific areas of the wafer.",zh:"薄膜沉積會將材料沉積在晶圓的特定區域。",opts:["A. deposit","B. deposits","C. depositing","D. deposited"],a:1,grammar:"現在簡單式｜第三人稱單數",why:"句子描述一般的製程事實，因此使用現在簡單式。主詞 Thin film deposition 是單數，主要動詞需要加上 -s，因此使用 deposits。"},
{stage:0,type:"選擇題 Multiple Choice",q:"The five core steps of semiconductor manufacturing ___ several important processes.",zh:"半導體製造的五個核心步驟包含數個重要製程。",opts:["A. includes","B. including","C. include","D. is include"],a:2,grammar:"主詞動詞一致｜複數主詞 + 原形動詞",why:"主詞 The five core steps 是複數，因此使用原形動詞 include。"},
{stage:0,type:"選擇題 Multiple Choice",q:"The wafer ___ several processing steps so far.",zh:"到目前為止，這片晶圓已經完成了好幾個製程步驟。",opts:["A. completes","B. has completed","C. completing","D. have completed"],a:1,grammar:"現在完成式｜have/has + 過去分詞",why:"So far（到目前為止）通常搭配現在完成式。The wafer 是單數，因此使用 has completed。若要更自然地描述晶圓經歷製程，也可說 The wafer has undergone several processing steps so far。"},
{stage:0,type:"句子重組 Sentence Scramble（單字按鈕）",kind:"scramble",q:"Rearrange the words to make a correct sentence.",zh:"請依序點選下方詞組，排列成正確句子：晶圓必須保持清潔，以防止受到污染。",words:["to prevent contamination","be kept clean","The wafer","must"],correctWords:["The wafer","must","be kept clean","to prevent contamination."],grammar:"情態助動詞與被動語態",why:"Must 表示「必須」，後面接原形動詞。此句使用被動語態，結構為 must + be + 過去分詞；to prevent contamination 表示目的。句型：主詞 + must + be + 過去分詞 + to + 原形動詞。"},
{stage:1,type:"選擇題 Multiple Choice",q:"___ the photolithography process use light to transfer circuit patterns?",zh:"微影製程會利用光線來轉移電路圖案嗎？",opts:["A. Do","B. Does","C. Is","D. Did uses"],a:1,grammar:"現在簡單式疑問句｜Do / Does",why:"主詞 the photolithography process 是單數，現在簡單式疑問句使用 Does + 主詞 + 原形動詞。Did 後面也應接原形動詞，不能使用 Did uses。"},
{stage:1,type:"選擇題 Multiple Choice",q:"The technician made the machine ___ before cleaning the wafer.",zh:"技術人員讓機器在清潔晶圓之前停止運轉。",opts:["A. stopped","B. stopping","C. to stop","D. stop"],a:3,grammar:"使役動詞 make + 受詞 + 原形動詞",why:"主動語態的使役動詞 make 後面使用 make + 受詞 + 原形動詞，因此正確用法是 made the machine stop。被動語態則可以說 The machine was made to stop。"},
{stage:1,type:"選擇題 Multiple Choice",q:"Engineers use photolithography ___ circuit patterns onto the wafer.",zh:"工程師使用微影技術，將電路圖案轉移到晶圓上。",opts:["A. transfer","B. transferring","C. transferred","D. to transfer"],a:3,grammar:"不定詞表目的｜to + 原形動詞",why:"To + 原形動詞可以表示目的，說明使用微影技術是為了轉移電路圖案，因此使用 to transfer。"},
{stage:1,type:"選擇題 Multiple Choice",q:"Before etching begins, engineers ___ check that the photoresist pattern is correct.",zh:"在開始蝕刻之前，工程師應該檢查光阻圖案是否正確。",opts:["A. should","B. must to","C. ought","D. can to"],a:0,grammar:"情態助動詞｜should + 原形動詞",why:"Should 表示建議或應該做的事，後面直接接原形動詞，因此是 should check。Must 和 can 後面不加 to；ought 通常需搭配 to，形成 ought to check。"},
{stage:1,type:"句子重組 Sentence Scramble（單字按鈕）",kind:"scramble",q:"Rearrange the words to make a correct sentence.",zh:"請依序點選下方詞組，排列成正確句子：如果當時光阻塗布得更均勻，圖案就會更清晰。",words:["would have been clearer.","the pattern","had been applied evenly,","if","the photoresist"],correctWords:["If","the photoresist","had been applied evenly,","the pattern","would have been clearer."],grammar:"第三類條件句｜過去完成式被動語態 + would have",why:"第三類條件句用來描述與過去事實相反的假設。常見句型：If + had + 過去分詞，主詞 + would have + 過去分詞。Had been applied 是過去完成式的被動語態；would have been clearer 表示對過去結果的假設。"},
{stage:2,type:"選擇題 Multiple Choice",q:"___ the engineer clean the wafer before the next process yesterday?",zh:"工程師昨天在進行下一個製程之前，有清潔晶圓嗎？",opts:["A. Does","B. Do","C. Did","D. Was"],a:2,grammar:"過去簡單式疑問句｜Did + 主詞 + 原形動詞",why:"Yesterday 表示過去時間，因此使用 Did + 主詞 + 原形動詞。使用 Did 後，動詞要用原形 clean，不能用 cleaned。"},
{stage:2,type:"選擇題 Multiple Choice",q:"The engineers ___ the cause of the equipment failure yesterday.",zh:"工程師昨天找出了設備故障的原因。",opts:["A. identify","B. identifies","C. identified","D. identifying"],a:2,grammar:"過去簡單式",why:"Yesterday 表示過去時間，因此使用過去簡單式。規則動詞 identify 的過去式為 identified。A. identify 是原形動詞；B. identifies 是現在簡單式第三人稱單數；C. identified 正確；D. identifying 是現在分詞，不能單獨作為主要動詞。"},
{stage:2,type:"選擇題 Multiple Choice",q:"The wafer ___ inside the chamber when the alarm sounded.",zh:"警報響起時，晶圓正在腔體內被處理。",opts:["A. was processed","B. was being processed","C. has processed","D. is processing"],a:1,grammar:"過去進行式被動語態｜was/were + being + 過去分詞",why:"When the alarm sounded 描述一個過去事件，當時正在進行的動作使用過去進行式被動語態：was/were + being + 過去分詞。主詞 The wafer 是單數，因此使用 was being processed。"},
{stage:2,type:"句子重組 Sentence Scramble（單字按鈕）",kind:"scramble",q:"Rearrange the words to make a correct sentence.",zh:"請依序點選下方詞組，排列成正確句子：如果晶圓受到污染，製程可能會失敗。",words:["the process","is contaminated,","may fail.","if","the wafer"],correctWords:["If","the wafer","is contaminated,","the process","may fail."],grammar:"第一類條件句｜If + 現在簡單式，主句 + may + 原形動詞",why:"第一類條件句用來描述未來可能發生的情況及其結果。If the wafer is contaminated 是使用現在簡單式被動語態的條件子句；the process may fail 使用 may + 原形動詞。If 子句放在句首時，通常在子句結尾加逗號。"},
{stage:3,type:"選擇題 Multiple Choice",q:"During routine production, engineers ___ the wafer surface before moving to the next step.",zh:"在例行生產期間，工程師通常會在進行下一步之前檢查晶圓表面。",opts:["A. usually check","B. check usually","C. usual check","D. usually checks"],a:0,grammar:"頻率副詞與主詞動詞一致｜usually + 原形動詞（複數主詞）",why:"頻率副詞 usually 通常放在主要動詞之前。主詞 engineers 是複數，因此使用 usually check。A. usually check 正確；B. check usually 語序不自然；C. usual 是形容詞，不能直接修飾動詞；D. usually checks 的動詞形式與複數主詞不一致。"},
{stage:3,type:"句子重組 Sentence Scramble（單字按鈕）",kind:"scramble",q:"Rearrange the words to make a correct sentence.",zh:"請依序點選下方詞組，排列成正確句子：如果工程師能更好地控制溫度，晶圓就會有較少的缺陷。",words:["the wafer","would have fewer defects.","the temperature better,","if","controlled","engineers"],correctWords:["If","engineers","controlled","the temperature better,","the wafer","would have fewer defects."],grammar:"第二類條件句｜If + 過去簡單式，主句 + would + 原形動詞",why:"第二類條件句用來描述與目前事實不同或不太可能發生的假設情況。Controlled 使用過去式表達假設；would have fewer defects 表示假設條件成立時的結果。"},
{stage:3,type:"句子重組 Sentence Scramble（單字按鈕）",kind:"scramble",q:"Rearrange the words to make a correct sentence.",zh:"請依序點選下方詞組，排列成正確句子：氣態前驅物在其中發生反應的反應腔體會用於化學氣相沉積（CVD）。",words:["is used in CVD.","gaseous precursors react","where","The reaction chamber"],correctWords:["The reaction chamber","where","gaseous precursors react","is used in CVD."],grammar:"Where 關係子句｜關係副詞表示地點",why:"Where 是關係副詞，用來引導與地點相關的關係子句。Where gaseous precursors react 修飾 the reaction chamber。主要子句是 The reaction chamber is used in CVD；where 子句表示「在該處」，可理解為 in which。"},
{stage:4,type:"選擇題 Multiple Choice",q:"___ the wafer surface helps remove unwanted material.",zh:"研磨晶圓表面有助於去除不需要的材料。",opts:["A. Polish","B. Polished","C. Polishing","D. To polishing"],a:2,grammar:"動名詞作主詞｜V-ing phrase",why:"動名詞可以在句子中作為主詞。此處 Polishing the wafer surface 是動名詞片語。To polishing 不正確，因為不定詞應使用 to + 原形動詞。"},
{stage:4,type:"選擇題 Multiple Choice",q:"Engineers avoid ___ the wafer with dirty tools.",zh:"工程師會避免使用不乾淨的工具操作晶圓。",opts:["A. handle","B. to handle","C. handling","D. handled"],a:2,grammar:"動名詞作動詞受詞｜avoid + V-ing",why:"動詞 avoid 後面接動名詞，句型為 avoid + V-ing，因此使用 handling。Avoid 後面一般不接不定詞 to handle。"},
{stage:4,type:"選擇題 Multiple Choice",q:"CMP, ___ combines chemical and mechanical action, flattens the wafer surface.",zh:"化學機械研磨（CMP）結合化學與機械作用，使晶圓表面平坦化。",opts:["A. who","B. which","C. where","D. what"],a:1,grammar:"Which 關係子句｜非限定關係子句",why:"Which 引導非限定關係子句，補充說明前面的 CMP。因為子句提供額外資訊，前後以逗號隔開。Who 用於人；where 用於地點；what 不可直接用於此類關係子句。"},
{stage:4,type:"選擇題 Multiple Choice",q:"The photoresist ___ protects the wafer surface is removed after etching.",zh:"保護晶圓表面的光阻會在蝕刻後被移除。",opts:["A. who","B. where","C. that","D. what"],a:2,grammar:"That 關係子句｜限定關係子句",why:"That 引導限定關係子句，說明是哪一個光阻。此處 that 在關係子句中作主詞，因此不能省略。Who 用於人；where 用於地點；what 不適用於此句型。"}
];
const stageNames=["01 薄膜沉積 Thin Film Deposition","02 微影 Photolithography","03 蝕刻 Etching","04 摻雜 Doping","05 化學機械研磨 CMP"];
let idx=0,answers=Array(questions.length).fill(null),started=false,locked=Array(questions.length).fill(false),scrambleSelections=Array.from({length:questions.length},()=>[]),pendingIndex=null;
const $=id=>document.getElementById(id);
function start(){if(!$("studentName").value.trim()||!$("studentId").value.trim()){alert("請先輸入姓名與學號。 Please enter your name and student ID.");return} $("homePanel").classList.add("hidden");$("startPanel").classList.add("hidden");$("quizPanel").classList.add("hidden");started=true;pendingIndex=0;showStageTransition(0,0,"first")}
function render(){
let q=questions[idx];$("stageLabel").textContent=stageNames[q.stage];$("typeLabel").textContent=q.type;
const answeredCount=answers.filter(a=>a!==null&&String(a).trim()!=="").length;
$("questionProgress").textContent=`第 ${idx+1} / ${questions.length} 題`;
$("answeredProgress").textContent=`已作答 ${answeredCount} / ${questions.length} 題`;
$("progressFill").style.width=`${answeredCount/questions.length*100}%`;
$("progressTrack").setAttribute("aria-valuenow",answeredCount);
$("questionText").textContent=q.q;$("questionZh").textContent=q.zh;$("feedback").textContent="";$("answerArea").innerHTML="";
if(q.kind==='scramble'){
  let selected=scrambleSelections[idx];
  let answerLine=document.createElement('div');answerLine.className='scramble-answer';answerLine.setAttribute('aria-label','已選單字順序');
  if(selected.length===0){let hint=document.createElement('span');hint.className='notice';hint.textContent='請依序點選下方單字';answerLine.appendChild(hint)}
  selected.forEach((word,pos)=>{let b=document.createElement('button');b.className='word-chip';b.textContent=word;b.title='點擊移除此單字';b.onclick=()=>{selected.splice(pos,1);answers[idx]=selected.length?selected.join(' '):null;render()};answerLine.appendChild(b)});
  let wordBank=document.createElement('div');wordBank.className='opts';wordBank.style.display='flex';wordBank.style.flexWrap='wrap';wordBank.style.gap='9px';
  q.words.forEach((word,wi)=>{let b=document.createElement('button');b.className='word-chip';b.textContent=word;b.disabled=selected.filter(x=>x===word).length>=q.words.slice(0,wi+1).filter(x=>x===word).length && selected.filter(x=>x===word).length>=q.words.slice(0,wi+1).filter(x=>x===word).length; b.disabled=selected.filter(x=>x===word).length>=q.words.slice(0,wi+1).filter(x=>x===word).length; b.onclick=()=>{if(selected.length<q.words.length){selected.push(word);answers[idx]=selected.join(' ');render()}};wordBank.appendChild(b)});
  let tools=document.createElement('div');tools.className='scramble-tools';let clear=document.createElement('button');clear.className='secondary';clear.textContent='重排答案 Clear';clear.onclick=()=>{scrambleSelections[idx]=[];answers[idx]=null;render()};tools.appendChild(clear);
  $('answerArea').appendChild(answerLine);$('answerArea').appendChild(wordBank);$('answerArea').appendChild(tools);
}else{
  let wrap=document.createElement('div');wrap.className='opts';q.opts.forEach((o,i)=>{let b=document.createElement('button');b.className='opt'+(answers[idx]===i?' selected':'');b.textContent=o;b.onclick=()=>{answers[idx]=i;render()};wrap.appendChild(b)});$('answerArea').appendChild(wrap);
}
$('nextBtn').disabled=answers[idx]===null||String(answers[idx]).trim()==='';$('nextBtn').textContent=idx===questions.length-1?'提交測驗 Submit':'下一題 Next'
}
function navigateTo(target){if(target<0||target>=questions.length)return;const oldStage=questions[idx].stage,newStage=questions[target].stage;if(oldStage!==newStage){pendingIndex=target;showStageTransition(newStage,target,target>idx)}else{idx=target;render()}}
function showStageTransition(stage,target,mode){const first=mode==="first",forward=mode===true;$("quizPanel").classList.add('hidden');$("stageTransition").classList.remove('hidden');const card=document.querySelectorAll('.image-stage')[stage];const img=card?card.querySelector('img'):null;$("transitionImage").src=img?img.src:'';$("transitionKicker").textContent=first?'STAGE START · 準備開始':(forward?'STAGE CLEARED · 闖關成功':'RETURNING STAGE · 返回關卡');$("transitionTitle").textContent=stageNames[stage];$("transitionDescription").textContent=first?'準備開始第一個製程挑戰！':(forward?'恭喜完成上一個製程！準備進入新的製程挑戰。':'返回上一個製程，繼續複習相關文法。');$("transitionProgress").textContent=`第 ${stage+1} / 5 個製程類別 · 題目 ${target+1} / ${questions.length}`;$("continueStageBtn").textContent=first?'進入第一關 Enter Stage 1 →':(forward?'進入下一關 Next Stage →':'返回上一關 Previous Stage →')}
$("continueStageBtn").onclick=()=>{if(pendingIndex===null)return;idx=pendingIndex;pendingIndex=null;$("stageTransition").classList.add('hidden');$("quizPanel").classList.remove('hidden');render()};
$("nextBtn").onclick=()=>{if(idx<questions.length-1)navigateTo(idx+1);else finish()};
function norm(s){return String(s||"").trim().toLowerCase().replace(/[.!?]/g,"").replace(/\s+/g," ")}
function correct(q,i){if(q.kind==='scramble')return norm(answers[i])===norm(q.correctWords.join(' '));if(q.opts)return answers[i]===q.a;return q.aText.some(a=>norm(a)===norm(answers[i]))}
function finish(){
$("quizPanel").classList.add("hidden");$("resultPanel").classList.remove("hidden");
let score=0;questions.forEach((q,i)=>{if(correct(q,i))score++});
const pct=Math.round(score/questions.length*100);const weak={};
questions.forEach((q,i)=>{if(!correct(q,i)){const k=q.grammar||"其他文法項目";weak[k]=(weak[k]||0)+1}});
const weakEntries=Object.entries(weak);
$("resultSummary").innerHTML=`姓名：${esc($("studentName").value)}｜學號：${esc($("studentId").value)}<br>測驗題數：${questions.length}　答對：${score}　正確率：${pct}%`;
$("printStudentSummary").innerHTML=`姓名：${esc($("studentName").value)}　學號：${esc($("studentId").value)}<br>測驗題數：${questions.length}　答對：${score}　正確率：${pct}%`;
// 每題相對難度：初級／中級／高級；不是正式 CEFR 分級。
const difficultyByQuestion=['初級','初級','中級','中級','初級','中級','初級','中級','高級','初級','初級','中級','中級','初級','高級','中級','初級','初級','中級','中級'];
const difficultyEnglish={'初級':'Beginner','中級':'Intermediate','高級':'Advanced'};
const levelStats=['初級','中級','高級'].map(level=>{const ids=questions.map((q,i)=>i).filter(i=>difficultyByQuestion[i]===level);const right=ids.filter(i=>correct(questions[i],i)).length;return {level,total:ids.length,right,pct:ids.length?Math.round(right/ids.length*100):0}});
let difficultySummary=`<section class="report-focus"><h2>題目難度與作答表現</h2><p>難度為本測驗內部的相對難度分類，依文法結構與作答要求區分，並非正式 CEFR 等級或標準化能力認證。</p><ul>${levelStats.map(x=>`<li>${x.level} ${difficultyEnglish[x.level]}：答對 ${x.right} / ${x.total} 題（${x.pct}%）</li>`).join('')}</ul></section>`;
let focus=`<section class="report-focus"><h2>需要加強的文法項目</h2>${weakEntries.length?'<ul>'+weakEntries.map(([k,v])=>`<li>${esc(k)}：答錯 ${v} 題</li>`).join('')+'</ul>':'<p>本次測驗全數答對，請持續練習並複習各項文法。</p>'}</section>`;
let records=questions.map((q,i)=>{let ok=correct(q,i),given=answers[i]===null?"未作答":(q.kind==='scramble'?answers[i]:q.opts[answers[i]]),answer=q.kind==='scramble'?q.correctWords.join(' '):q.opts[q.a];return `<tr class="${ok?'row-good':'row-bad'}"><td>${i+1}</td><td>${difficultyByQuestion[i]}<br>${difficultyEnglish[difficultyByQuestion[i]]}</td><td><strong>${esc(q.type||'文法題')}</strong><br>${esc(q.q)}${q.kind==='scramble'?`<div class="zhprint"><strong>Word groups:</strong> ${esc(q.words.join(' / '))}</div>`:''}<div class="zhprint">${esc(q.zh)}</div></td><td>${esc(given)}</td><td>${esc(answer)}</td><td class="${ok?'result-good':'result-bad'}">${ok?'✓ 答對':'✗ 答錯'}</td><td><strong>${esc(q.grammar||'文法應用')}</strong><br>${esc(q.why)}</td></tr>`}).join('');
const recordsTable=`<div class="table-wrap"><table class="report-table"><thead><tr><th>#</th><th>難易度</th><th>題目</th><th>學生答案</th><th>正確答案</th><th>結果</th><th>文法說明</th></tr></thead><tbody>${records}</tbody></table></div>`;
$("detailedResults").innerHTML=difficultySummary+focus+`<h2>作答紀錄與詳細結果</h2>${recordsTable}`
}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
$("startBtn").onclick=start;$("pdfBtn").onclick=()=>window.print();$("retryBtn").onclick=()=>location.reload();
</script></body></html>
